<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator trasy — auto vs rower</title>
<meta name="description" content="Wpisz dystans, spalanie i cenę paliwa — zobacz koszt i czas autem oraz porównanie z rowerem (czas i kalorie).">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- TODO: link do portfolio, gdy powstanie -->
  <h1>Kalkulator trasy</h1>
  <p>Ile kosztuje dojazd autem — i ile spalisz rowerem.</p>
  <section class="card">
    <label>Dystans (km) <input id="km" type="number" min="0" step="any" value="12"></label>
    <label>Spalanie (l/100 km) <input id="spal" type="number" min="0" step="any" value="7"></label>
    <label>Cena paliwa (zł/l) <input id="cena" type="number" min="0" step="any" value="6.5"></label>
    <label>Śr. prędkość auta (km/h) <input id="vauto" type="number" min="1" value="50"></label>
  </section>
  <section class="card">
    <h2>Wynik</h2>
    <p id="err" class="hint" hidden>Podaj dystans większy od zera.</p>
    <div id="out" class="big"></div>
    <p id="detail" class="hint"></p>
  </section>
  <div id="ads-slot" hidden></div>
  <footer><a href="privacy.html">Prywatność</a> · <a href="kontakt.html">Kontakt</a></footer>
</main>
<script src="app.js"></script>
<script src="ads.js"></script>
</body>
</html>
